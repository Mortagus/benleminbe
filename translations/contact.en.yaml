contact:
    meta:
        title: "Contact | Benjamin Lemin"
        description: "Contact Benjamin Lemin about a salaried employment opportunity, an experienced web developer role, or to learn more about his professional background."

    hero:
        eyebrow: "Contact"
        title: "The easiest way to reach me is to write to me directly."
        intro: >
            If you would like to discuss a **professional opportunity**, your team or a potential role,
            send me a few lines about the context. This will help me respond more quickly and clearly.
        actions:
            label: "Main actions"
            email: "Send me an email"
            linkedin: "Contact me on LinkedIn"
        note: "To get the conversation started, a little information about **your context and the opportunity you have in mind** is all I need."

    methods:
        eyebrow: "Contact options"
        title: "Choose whichever way of getting in touch works best for you"
        intro: "I'm happy to reply through whichever channel suits you best. If you're unsure, **email is the most direct option**."

        linkedin:
            name: "LinkedIn"
            description: "To discuss a **professional opportunity**, a project or my background."
            action: "Open →"

        email:
            name: "Email"
            description: "For a direct message, a question or an initial conversation."
            action: "Write →"

        whatsapp:
            name: "WhatsApp"
            description: "For a quick chat if we're already in touch."
            action: "Message →"

    details:
        request:
            title: "To make our conversation easier"
            intro: "To help me give you a useful reply, a short message could include:"
            item_1: "the **context** of the opportunity;"
            item_2: "the **position** or role you have in mind;"
            item_3: "the **team** and technical environment;"
            item_4: "your preferred **way to get back to you**."

        availability:
            title: "Opportunities I'm looking for"
            paragraph_1: >
                I'm open to **salaried employment opportunities** where my experience in PHP,
                Symfony and Drupal backend development, along with my full-stack background, could be useful.

            paragraph_2: >
                I'm particularly interested in **maintaining and evolving existing applications**,
                software design, system integration and working as part of a technical team.