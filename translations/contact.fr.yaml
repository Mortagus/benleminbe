contact:
    meta:
        title: "Contact | Benjamin Lemin"
        description: "Contactez Benjamin Lemin pour une opportunité professionnelle salariée, un poste de développeur web expérimenté ou un échange autour de son parcours."

    hero:
        eyebrow: "Contact"
        title: "Le plus simple : m'écrire directement."
        intro: >
            Si vous souhaitez me parler d'une **opportunité professionnelle**, d'une équipe ou d'un poste,
            envoyez-moi quelques lignes sur le contexte. Je pourrai vous répondre plus vite et plus clairement.
        actions:
            label: "Actions principales"
            email: "M'envoyer un email"
            linkedin: "Me contacter sur LinkedIn"
        note: "Pour faciliter notre échange, quelques informations sur **votre contexte et l’opportunité envisagée** suffisent pour commencer."

    methods:
        eyebrow: "Canaux"
        title: "Choisissez le canal le plus simple pour vous"
        intro: "Je peux répondre par le canal qui vous arrange le mieux. Si vous hésitez, **l'email reste le plus direct**."

        linkedin:
            name: "LinkedIn"
            description: "Pour échanger autour d'une **opportunité professionnelle**, d'un projet ou de mon parcours."
            action: "Ouvrir →"

        email:
            name: "Email"
            description: "Pour un message direct, une question ou une première prise de contact."
            action: "Écrire →"

        whatsapp:
            name: "WhatsApp"
            description: "Pour un échange rapide si nous sommes déjà en contact."
            action: "Écrire →"

    details:
        request:
            title: "Pour faciliter l'échange"
            intro: "Pour vous répondre utilement, un message court peut préciser :"
            item_1: "le **contexte** de l'opportunité ;"
            item_2: "le **poste** ou le rôle envisagé ;"
            item_3: "l'**équipe** et l'environnement technique ;"
            item_4: "le **canal de réponse** que vous préférez."

        availability:
            title: "Opportunités recherchées"
            paragraph_1: >
                Je suis à l'écoute d'**opportunités professionnelles salariées** où mon expérience backend PHP,
                Symfony et Drupal, ainsi que mon parcours full-stack, peuvent être utiles.

            paragraph_2: >
                Je m'intéresse particulièrement à la **maintenance et l'évolution d'applications existantes**,
                à la conception, à l'intégration et au travail au sein d'une équipe technique.
