help:
    title: "Les contextes dans lesquels j'apporte mon expérience"
    card_1:
        title: "Conception d'outils métier"
        text: "Création d'**applications adaptées** aux processus et contraintes réels."
    card_2:
        title: "Évolution d'applications"
        text: "Ajout de fonctionnalités, corrections et évolution d'outils **devenus difficiles à maintenir**."
    card_3:
        title: "Reprise de projets existants"
        text: "Reconstruction de la connaissance lorsque **le contexte s'est dispersé**."
    card_4:
        title: "Domaines métier complexes"
        text: "Compréhension rapide des **règles, contraintes et risques**."
    card_5:
        title: "Travail en équipe"
        text: "Collaboration avec des équipes produit, métier et techniques comme **développeur expérimenté**."
    card_6:
        title: "Intégration de systèmes"
        text: "Connexion d'applications à des **données, APIs et services externes**."

concrete:
    title: "Compétences mises en pratique"
    item_1: "**Comprendre un existant complexe** : analyser le code, les données et les règles métier avant de le faire évoluer."
    item_2: "**Diagnostiquer et résoudre des problèmes** : identifier leur origine et apporter des corrections adaptées au contexte."
    item_3: "**Concevoir des évolutions maintenables** : développer de nouvelles fonctionnalités en tenant compte de l'architecture et des besoins métier."
    item_4: "**Fiabiliser les changements** : utiliser les tests, la revue de code et une progression par étapes pour limiter les risques."
    item_5: "**Collaborer et transmettre** : clarifier les besoins, partager les connaissances et faciliter le travail au sein d'une équipe."

projects:
