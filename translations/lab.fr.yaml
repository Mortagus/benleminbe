            meta_label: "Métadonnées des boids en 3D"
            meta:
                1: "p5.js"
                2: "Caméra libre"
                3: "Évitement des arbres"
            action: "Voir les boids 3D"
    hero:
        eyebrow: "Lab"
        title: "Simulations"
        intro: "Des simulations interactives où **des règles simples** produisent des comportements d’ensemble. Chacune se règle en direct et reste intégrée au code du site."
    boids:
        title: "Boids"
        page_title: "Boids en 2D"
        meta:
            title: "Boids en 2D"
            description: "Simulation interactive des boids en 2D (modèle de Reynolds) en JavaScript et p5.js."
        description: "Chaque boid ne suit que **trois règles locales** : s’aligner sur ses voisins, s’en éloigner s’ils sont trop proches et rejoindre leur centre. Le vol de groupe en émerge sans chef ni plan global. Modèle de Craig Reynolds (1986)."
        canvas_label: "Simulation de boids : des triangles se déplacent en groupe sur un fond uni."
        pointer_hint: "Clic gauche maintenu : repousse les boids. Clic droit maintenu : les attire."
        controls:
            label: "Contrôles de la simulation"
            pause: "Pause"
            resume: "Reprendre"
            reset: "Réinitialiser"
            count: "Nombre de boids"
            perception: "Rayon de perception"
            speed: "Vitesse maximale"
            angle: "Champ de vision"
            neighbours: "Voisins pris en compte"
            smoothing: "Lissage des virages"
            force: "Force de braquage maximale"
            alignment_weight: "Poids de l’alignement"
            separation_weight: "Poids de la séparation"
            cohesion_weight: "Poids de la cohésion"
            units:
                pixels: "\u00a0px"
                degrees: "°"
                pixels_per_frame: "\u00a0px/image"
        rules:
            title: "Les trois règles"
            alignment: "**Alignement** : prendre la direction moyenne des voisins."
            separation: "**Séparation** : s’écarter des voisins trop proches."
            cohesion: "**Cohésion** : se rapprocher du centre des voisins."
    boids3d:
        title: "Boids en 3D"
        page_title: "Boids en 3D"
        meta:
            title: "Boids en 3D"
            description: "Simulation 3D d’une nuée d’oiseaux au coucher du soleil en JavaScript et p5.js : meneurs, onde et évitement des arbres."
        description: "Une **nuée d’oiseaux en 3D** au coucher du soleil. Aux trois règles des boids s’ajoutent **quelques meneurs** qui sentent une cible invisible, une **onde** qui fait onduler le groupe et l’**évitement** des arbres : la nuée s’étire en nappe, ondule, se défait et se reforme."
        canvas_label: "Simulation de boids en 3D : une nuée d’oiseaux vole au-dessus d’un paysage d’arbres et de lignes électriques, sur un ciel de coucher de soleil."
        camera_hint: "Glissez pour tourner autour de la scène, molette ou pincement pour zoomer. La caméra reste au-dessus du sol."
        controls:
            label: "Contrôles de la simulation"
            pause: "Pause"
            resume: "Reprendre"
            reset: "Réinitialiser"
            count: "Nombre de boids"
            leaders: "Meneurs (part des boids qui sentent la cible)"
            wave: "Ondulation"
            units:
                percent: "\u00a0%"
        rules:
            title: "Ce qui se passe"
            leaders: "**Meneurs** : seule une petite part des oiseaux sent la cible invisible, les autres suivent par alignement et cohésion, donc un virage se propage dans le groupe avec un délai."
            wave: "**Onde** : une poussée verticale qui voyage dans l’espace fait monter certains oiseaux pendant que d’autres descendent."
            avoidance: "**Évitement** : un oiseau regarde devant lui et ne dévie que si sa trajectoire va toucher un arbre ; sinon il ne ressent aucune force."
