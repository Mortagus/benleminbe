    index:
        title: "Choisir une simulation"
        boids2d:
            label: "2D"
            title: "Boids en 2D"
            description: "Les trois règles de Reynolds sur un fond uni : alignement, séparation et cohésion, avec dix curseurs et le pointeur pour repousser ou attirer les boids."
            meta_label: "Métadonnées des boids en 2D"
            meta:
                1: "p5.js"
                2: "Curseurs en direct"
                3: "Souris"
            action: "Voir les boids 2D"
        boids3d:
            label: "3D"
            title: "Boids en 3D"
