privacy_policy:
    meta:
        title: "Privacy Policy | Benjamin Lemin"
        description: "Privacy policy for Benjamin Lemin's personal website."
    hero:
        eyebrow: "Personal Data"
        title: "Privacy Policy"
    sections:
        controller:
            title: "Data Controller"
            paragraphs:
                1: "The data controller responsible for processing personal data collected through this website is Benjamin Lemin."
                2: "Full contact details are available on the Legal Notice page of this website."
        data_collected:
            title: "Data Collected"
            paragraphs:
                1: "When you contact me by email or through another method provided on this website, your name, contact details and the content of your message may be processed."
                2: "External platforms used to make contact apply their own privacy policies."
                3: "When a résumé download link is activated, the website records the date and time of the event, the language version inferred from the referring page, the address of that page and the identification string (\"User-Agent\") transmitted by the browser. This application log does not directly record the IP address."
                4: "The hosting provider also records technical data relating to HTTP requests as part of its server logs."
        purposes:
            title: "Purposes of Processing"
            paragraphs:
                1: "Personal data is used to respond to messages and exchanges about my background or professional opportunities."
                2: "Events related to clicks on résumé download links may be used to produce aggregated statistics and assess interest in the professional profile presented on this website."
        legal_basis:
            title: "Legal Basis"
            paragraphs:
                1: "Contact data is processed on the basis of the legitimate interest in replying to received messages and managing professional exchanges."
                2: "Information relating to résumé downloads is processed on the basis of the legitimate interest in measuring interest in the professional profile presented on this website."
                3: "Technical data required for the security and proper functioning of the website is processed on the basis of the legitimate interest in ensuring those functions."
                4: "Where required by law, certain data may be retained in order to comply with a legal obligation."
        retention:
            title: "Data Retention"
            paragraphs:
                1: "Professional exchanges mainly take place by email or through external platforms, which apply their own retention policies."
                2: "Events related to clicks on résumé download links are recorded in an application log on the server. The application currently does not provide any automatic deletion of these events."
                3: "The retention of technical logs related to hosting depends on the configuration and policies applied by the hosting provider."
        recipients:
            title: "Recipients of the Data"
            paragraphs:
                1: "Personal data is processed by Benjamin Lemin and is neither sold nor disclosed to third parties for commercial purposes."
                2: "The hosting provider, Infomaniak Network SA, established in Switzerland, may have access to certain data as part of the hosting and maintenance of the infrastructure."
                3: "Switzerland benefits from an adequacy decision by the European Commission, which recognizes an adequate level of protection under European data protection regulations."
        external_links:
            title: "Links to External Platforms"
            paragraphs:
                1: "This website contains links to external platforms such as LinkedIn, GitHub, Superprof and WhatsApp."
                2: "When you click these links, you leave this website and any data processing is then governed by the privacy policy of the relevant service."
        cookies:
            title: "Cookies and Local Storage"
            paragraphs:
                1: "This website does not use advertising or analytics cookies."
                2: "A technical session cookie is used for authentication and security in the private area, which is reserved for the website administrator. Public account registration is not available. This cookie has no persistent retention period; its removal at the end of the session depends on how your browser operates."
                3: "Some public features save data in your browser’s local storage: your theme preference, your saved D&D encounter, and your Simon game settings and best score. These local saves are not sent to the server or to a third-party service."
                4: "These locally stored data have no automatic expiry. You can erase them through your browser settings by clearing this website’s data. The D&D tool also lets you delete its local save; Simon lets you reset the keyboard controls."
                5: "If you import a D&D character as an XML file, the complete file and its name are sent to this website’s server for analysis. The extracted information is returned to your browser and may be included in the locally saved encounter. The application does not retain a lasting copy of the file or the result on the server and does not send them to a third-party service. Temporary files are managed by the hosting environment."
        security:
            title: "Security"
            paragraphs:
                1: "Reasonable technical and organizational measures are implemented to protect personal data against loss, unauthorized access and misuse."
                2: "As no transmission or storage method can guarantee absolute security, complete protection cannot be guaranteed."
        rights:
            title: "Your Rights"
            paragraphs:
                1: "You have the right to access, rectify, erase, restrict and object to the processing of your personal data."
                2: "Where the conditions provided for by applicable regulations are met, you also have a right to data portability for certain data."
                3: "To exercise your rights, you may contact Benjamin Lemin at benjamin@lemin.be or use the contact details provided in the Legal Notice."
        complaint:
            title: "Complaint"
            paragraphs:
                1: "If you believe that your personal data is being processed in a manner that does not comply with applicable legislation, you may lodge a complaint with the Belgian Data Protection Authority."
                2: "Belgian Data Protection Authority, Rue de la Presse 35, 1000 Brussels, Belgium."
        updates:
            title: "Changes to This Policy"
            paragraphs:
                1: "This privacy policy may be updated to reflect changes to the website or applicable legal obligations."
                2: "The last updated date indicated on this page identifies the version currently in force."
                3: "Any changes take effect as soon as they are published on this page."
            last_updated:
                label: "Last updated"
                value: "September 22, 2026"
