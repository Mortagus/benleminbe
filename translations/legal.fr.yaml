privacy_policy:
    meta:
        title: "Politique de confidentialité | Benjamin Lemin"
        description: "Politique de confidentialité du site personnel de Benjamin Lemin."
    hero:
        eyebrow: "Données personnelles"
        title: "Politique de confidentialité"
    sections:
        controller:
            title: "Responsable du traitement"
            paragraphs:
                1: "Le responsable du traitement des données personnelles collectées via ce site est Benjamin Lemin."
                2: "Ses coordonnées complètes sont disponibles sur la page Mentions légales du site."
        data_collected:
            title: "Données collectées"
            paragraphs:
                1: "Lorsque vous prenez contact par e-mail ou par un autre moyen proposé sur ce site, votre nom, vos coordonnées et le contenu de votre message peuvent être traités."
                2: "Les plateformes externes utilisées pour la prise de contact appliquent leurs propres politiques de confidentialité."
                3: "Lorsqu'un lien de téléchargement du curriculum vitae est activé, le site enregistre la date et l'heure de l'événement, la version linguistique déduite de la page d'origine, l'adresse de cette page ainsi que la chaîne d'identification (« User-Agent ») transmise par le navigateur. Ce journal applicatif n'enregistre pas directement l'adresse IP."
                4: "L'hébergeur du site enregistre également des données techniques relatives aux requêtes HTTP dans le cadre de ses journaux serveurs."
        purposes:
            title: "Finalités du traitement"
            paragraphs:
                1: "Les données personnelles sont utilisées pour répondre aux prises de contact et aux échanges relatifs au parcours ou à des opportunités professionnelles."
                2: "Les informations relatives au téléchargement du curriculum vitae sont utilisées à des fins statistiques et pour mesurer l'intérêt porté au profil professionnel présenté sur ce site."
        legal_basis:
            title: "Base juridique"
            paragraphs:
                1: "Les données liées aux prises de contact sont traitées dans l'intérêt légitime de répondre aux messages reçus et de gérer les échanges professionnels."
                2: "Les événements liés aux clics sur les liens du curriculum vitae peuvent être utilisés pour établir des statistiques agrégées et évaluer l'intérêt porté au profil professionnel présenté sur ce site."
                3: "Les données techniques nécessaires à la sécurité et au bon fonctionnement du site sont traitées dans l'intérêt légitime d'assurer ces fonctions."
                4: "Lorsque la législation l'impose, certaines données peuvent être conservées afin de respecter une obligation légale."
        retention:
            title: "Conservation des données"
            paragraphs:
                1: "Les échanges professionnels ont lieu principalement par messagerie électronique ou via des plateformes externes, qui appliquent leurs propres règles de conservation."
                2: "Les événements liés aux clics sur les liens du curriculum vitae sont enregistrés dans un journal applicatif sur le serveur. L'application ne prévoit actuellement aucune suppression automatique de ces événements."
                3: "La conservation des journaux techniques liés à l'hébergement dépend de la configuration et des règles appliquées par l'hébergeur."
        recipients:
            title: "Destinataires des données"
            paragraphs:
                1: "Les données personnelles sont traitées par Benjamin Lemin et ne sont ni vendues ni communiquées à des tiers à des fins commerciales."
                2: "L'hébergeur du site, Infomaniak Network SA, établi en Suisse, peut avoir accès à certaines données dans le cadre de l'hébergement et de la maintenance de l'infrastructure."
                3: "La Suisse bénéficie d'une décision d'adéquation de la Commission européenne, qui reconnaît un niveau de protection adéquat au regard de la réglementation européenne."
        external_links:
            title: "Liens vers des plateformes externes"
            paragraphs:
                1: "Le site contient des liens vers des plateformes externes telles que LinkedIn, GitHub, Superprof ou WhatsApp."
                2: "Lorsque vous cliquez sur ces liens, vous quittez ce site et les traitements de données relèvent alors de la politique de confidentialité propre à ces services."
        cookies:
            title: "Cookies et stockage local"
            paragraphs:
                1: "Le site n’utilise pas de cookies publicitaires ou de mesure d’audience."
                2: "Un cookie de session technique est utilisé pour l’authentification et la sécurité de l’espace privé, réservé à l’administrateur du site. Aucune création de compte public n’est proposée. Ce cookie n’a pas de durée de conservation persistante ; sa suppression à la fin de la session dépend du fonctionnement du navigateur."
                3: "Certaines fonctionnalités publiques enregistrent des données dans le stockage local de votre navigateur : votre préférence de thème, la sauvegarde de votre rencontre D&D, ainsi que les réglages du jeu Simon et votre meilleur score. Ces sauvegardes locales ne sont pas envoyées au serveur ni à un service tiers."
                4: "Aucune expiration automatique n’est prévue pour ces données locales. Vous pouvez les effacer dans les paramètres de votre navigateur en supprimant les données de ce site. L’outil D&D permet également de supprimer sa sauvegarde locale ; Simon permet de réinitialiser les touches du clavier."
                5: "Si vous importez un personnage D&D au format XML, le fichier complet et son nom sont transmis au serveur du site pour être analysés. Les informations extraites sont renvoyées à votre navigateur et peuvent être incluses dans la sauvegarde locale de la rencontre. L’application ne conserve pas de copie durable du fichier ou du résultat sur le serveur et ne les transmet pas à un service tiers. La gestion des fichiers temporaires relève de l’environnement d’hébergement."
        security:
            title: "Sécurité"
            paragraphs:
                1: "Des mesures techniques et organisationnelles raisonnables sont mises en œuvre afin de protéger les données personnelles contre la perte, l'accès non autorisé ou l'utilisation abusive."
                2: "Aucune méthode de transmission ou de stockage ne pouvant garantir une sécurité absolue, une protection totale ne peut toutefois être assurée."
        rights:
            title: "Vos droits"
            paragraphs:
                1: "Vous disposez d'un droit d'accès, de rectification, d'effacement, de limitation et d'opposition au traitement de vos données personnelles."
                2: "Vous disposez également, lorsque les conditions prévues par la réglementation applicable sont réunies, d'un droit à la portabilité de certaines données."
                3: "Pour exercer vos droits, vous pouvez contacter Benjamin Lemin à l'adresse benjamin@lemin.be ou utiliser les coordonnées reprises dans les Mentions légales."
        complaint:
            title: "Réclamation"
            paragraphs:
                1: "Si vous estimez que vos données personnelles sont traitées de manière non conforme à la législation applicable, vous pouvez introduire une réclamation auprès de l'Autorité de protection des données."
                2: "Autorité de protection des données, Rue de la Presse 35, 1000 Bruxelles, Belgique."
        updates:
            title: "Modification de la politique"
            paragraphs:
                1: "La présente politique de confidentialité peut être mise à jour afin de refléter les évolutions du site ou des obligations légales."
                2: "La date de dernière mise à jour indiquée sur cette page permet d'identifier la version actuellement en vigueur."
                3: "Les modifications prennent effet dès leur publication sur cette page."
            last_updated:
                label: "Dernière mise à jour"
                value: "22 septembre 2026"
