    description: "Discover the skills that define my profile: PHP / Symfony / Drupal backend, business web applications, APIs, continuous maintenance and existing project takeovers."

hero:
    eyebrow: "Skills"
    title: "Backend first, everything else supports it."
    intro: "For more than 15 years, my work has been defined first and foremost by **PHP, Symfony, Drupal**, **business web applications**, **APIs** and **continuous maintenance**. The rest of my experience complements that core, but does not define it at the same level."
