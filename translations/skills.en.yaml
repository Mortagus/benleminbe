            value: "Takeover & evolution"
            label: "of existing applications"

sections:
    core:
        eyebrow: "Core expertise"
        title: "What truly defines my profile"
        intro: "I mainly work on understanding, taking over and evolving **business web applications** already in production."

    system:
        eyebrow: "Beyond the code"
        title: "Understanding the system beyond the code"
        intro: "A business application reflects processes, rules, constraints and decisions made by people. An important part of my work is understanding that whole before evolving it properly."

    regular:
        eyebrow: "Regular skills"
        title: "What I use frequently in that context"
        intro: "These technologies and practices recur throughout my professional experience, but they support the core profile rather than replacing it."

    complementary:
        eyebrow: "Complementary experience"
        title: "Technologies and environments I have encountered"
        intro: "They are part of my journey, but they do not describe my professional profile on their own."

    summary:
        eyebrow: "Summary"
        title: "Backend first, everything else in support"
        paragraph_1: "My core work is **PHP, Symfony, Drupal**, **business web applications**, **APIs**, **continuous maintenance** and **existing project takeovers**."
        paragraph_2: "Around that core, I regularly use the tools that help deliver, operate and improve applications over time: data stores, Git, Docker, CI/CD, automated testing, refactoring and production analysis."
        paragraph_3: "Over the years, I have also learned to understand what surrounds the code: the **business domain**, **users**, **processes**, other systems and project constraints, so a team can evolve what already exists without losing its meaning."
        actions:
            contact: "Contact me"
            projects: "See projects"

