system:
    domain:
        title: "Understanding a business domain"
        text: "Progressively build a mental model of a domain I do not yet know by talking with the people who work in it, to understand its concepts, rules and constraints."
        context: "Contexts: agriculture · finance · healthcare · media · retail · logistics"

    translation:
        title: "Translating business into software"
        text: "Turn real processes into data models, business rules, workflows and understandable features."
        context_before: "Contexts: "
        context_project: "Sogesa ERP"
        context_after: " · business platforms · analysis of a rental-management product"

    existing:
        title: "Understanding an existing system"
        text: "Progressively reconstruct how an application works from its code, data, integrations and usage, even when documentation is incomplete, before making reliable changes."
        context_before: "Examples: "
        context_delcampe: "Delcampe"
        context_keytrade: "Keytrade"
        context_dpi: "DPI"
        context_stanhome: "Stanhome"
        context_separator: " · "

    constraints:
        title: "Identifying the real constraints"
        text: "Do not reduce a problem to its technical symptom: account for business, technical, organisational and budget constraints, as well as those imposed by external systems."
        context: "Examples: authentication integrations · permissions · environments · shared responsibilities"

    tradeoffs:
        title: "Making trade-offs instead of over-designing"
        text: "Choose a solution that fits the real need by balancing value, complexity, cost, time, risk and maintainability."
        context: "Practices: incremental evolution · focused MVPs · useful refactoring"

    shared_understanding:
        title: "Building shared understanding"
        text: "Explain a problem clearly, make assumptions explicit and adapt the level of detail for a developer, business lead, client or learner."
        context: "Practices: documentation · mentoring · programming coaching since 2021"

